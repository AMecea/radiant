[project]
name = "radiant"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flavius Mecea", email = "flavius.mecea@icloud.com" }]
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
    "tqdm>=4.65",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
radiant = "radiant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radiant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # librosa → audioread imports stdlib modules deprecated in 3.12; not ours to fix.
    "ignore:'(aifc|audioop|sunau)' is deprecated:DeprecationWarning",
]
