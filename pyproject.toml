[project]
name = "video-radiant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "faster-whisper>=1.0",
    "tqdm>=4.65",
]

[project.scripts]
video_editor = "video_editor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_editor"]
